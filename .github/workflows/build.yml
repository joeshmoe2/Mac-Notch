name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchHub.xcodeproj \
            -scheme NotchHub \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=300' \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Verify sources were compiled
        run: |
          COUNT=$(grep -cE "^SwiftCompile .*\.swift" build.log || true)
          echo "Compiled Swift files: $COUNT"
          grep -E "^SwiftCompile .*\.swift" build.log | sed -E 's/.* ([^ ]+\.swift).*/\1/' | xargs -n1 basename | sort -u
          test "$COUNT" -gt 10
          APP=$(find build/Build/Products/Debug -maxdepth 1 -name "NotchHub.app")
          ls -la "$APP/Contents/MacOS"
          echo "Embedded companion:"
          ls -la "$APP/Contents/Helpers/NotchNotes.app/Contents/MacOS"
      - name: Build NotchNotes companion (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchHub.xcodeproj \
            -scheme NotchNotes \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee notes-build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" notes-build.log
          ls -la build/Build/Products/Debug/NotchNotes.app/Contents/MacOS
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            notes-build.log
